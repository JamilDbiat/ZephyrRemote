name: Phone app

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
      - run: dotnet workload install maui-android
      - run: dotnet publish app/ZephyrApp/ZephyrApp.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=apk -o out
      - uses: actions/upload-artifact@v4
        with:
          name: ZephyrRemote-android
          path: out/*-Signed.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Use newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
      - run: dotnet workload install maui-ios
      - run: dotnet build app/ZephyrApp/ZephyrApp.csproj -f net10.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false
      - name: Make IPA
        run: |
          APP=$(find app/ZephyrApp/bin/Release -name "*.app" -type d | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr ZephyrRemote-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ZephyrRemote-ios
          path: ZephyrRemote-unsigned.ipa
